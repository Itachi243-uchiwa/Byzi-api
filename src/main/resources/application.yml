spring:
  application:
    name: byzi-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/byzi}
    username: ${DB_USERNAME:byzi}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    hibernate:
      # "validate" en toutes circonstances : le schema est PILOTE par Flyway, jamais par
      # Hibernate ddl-auto (qui ne doit JAMAIS valoir "update"/"create" en production -
      # risque de perte de donnees ou de derive de schema non tracee, OWASP A05).
      ddl-auto: validate
    open-in-view: false
    # Volontairement PAS de hibernate.jdbc.time_zone ici : ce reglage sert aux colonnes SANS
    # fuseau, alors que tout le schema utilise "timestamp with time zone", qui porte deja
    # l'offset. L'ajouter reintroduit une conversion parasite sur les Instant.

  flyway:
    enabled: true
    baseline-on-migrate: false

  data:
    web:
      pageable:
        # @PageableDefault(size = 50) sur les controllers de synchronisation ne fixe que la
        # valeur PAR DEFAUT, pas le maximum : un client pouvait demander ?size=2000 et forcer
        # le chargement de 2 000 app_block_rules, dont le champ selection_data peut atteindre
        # 200 000 caracteres - plusieurs centaines de Mo serialises en une seule reponse,
        # soit de quoi faire tomber la JVM en un appel. Ce plafond s'applique a toutes les
        # routes paginees, y compris celles qui seront ajoutees plus tard.
        max-page-size: 100

# Ne jamais journaliser le corps des requetes/reponses en production (peut contenir des
# tokens ou des blobs de selection d'apps) : desactive par defaut, a n'activer qu'en dev
# de maniere ciblee.
logging:
  level:
    root: INFO
    com.byzi.api: INFO
    org.springframework.security: INFO
  pattern:
    # Insere l'identifiant de requete (RequestIdFilter) dans le motif par defaut de Spring
    # Boot, qui reserve cet emplacement. Passer par "correlation" plutot que par une
    # redefinition complete du motif conserve la coloration et l'alignement d'origine, et
    # evite d'avoir a resuivre les evolutions du format entre versions.
    #
    # Le ":-" rend le champ vide hors requete HTTP (demarrage, taches planifiees) plutot que
    # d'y afficher la mention "requestId_IS_UNDEFINED".
    correlation: "[%X{requestId:-}] "

byzi:
  security:
    jwt:
      # Secret injecte UNIQUEMENT via variable d'environnement, jamais commite (OWASP A02).
      secret: ${JWT_SECRET}
      issuer: "byzi-api"
      access-token-ttl-seconds: 900        # 15 minutes : fenetre courte en cas de fuite
      refresh-token-ttl-seconds: 2592000    # 30 jours
    apple:
      issuer: "https://appleid.apple.com"
      audience: ${APPLE_BUNDLE_ID:com.byzi.app}
      jwks-url: "https://appleid.apple.com/auth/keys"
    admin:
      # Liste d'appleSub separes par des virgules, promus ADMIN au demarrage s'ils existent
      # deja en base. Vide par defaut = aucun effet. A utiliser UNE SEULE FOIS au tout
      # premier deploiement (cf. AdminBootstrapRunner) puis a retirer/vider.
      bootstrap-apple-subs: ${ADMIN_BOOTSTRAP_APPLE_SUBS:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  referral:
    # Jours offerts au filleul ET au parrain a chaque utilisation d'un code (backlog 10.8).
    # Variable d'environnement : c'est un levier commercial, doubler l'offre le temps d'une
    # campagne ne doit demander ni deploiement ni mise a jour de l'app.
    trial-extension-days: ${REFERRAL_TRIAL_EXTENSION_DAYS:7}

  webhook:
    revenuecat:
      # Secret partage a recopier dans le dashboard RevenueCat (champ "Authorization header").
      # Seule protection de l'endpoint webhook : sans lui, n'importe qui pourrait s'octroyer
      # un abonnement actif. Injecte par variable d'environnement, jamais commite.
      secret: ${REVENUECAT_WEBHOOK_SECRET}

management:
  endpoints:
    web:
      exposure:
        # metrics n'est PAS public : la chaine de securite reserve tout /actuator autre que
        # /health au role ADMIN. Sans cette regle, n'importe quel utilisateur de l'app,
        # simplement authentifie, pouvait lire les endpoints de supervision.
        include: health,info,metrics
  endpoint:
    health:
      # Ne pas exposer le detail des composants (DB, disque...) publiquement, meme sur
      # l'endpoint de sante - reduit la surface d'information exploitable (OWASP A05).
      show-details: never
      # Sondes liveness/readiness distinctes, attendues par Docker et les orchestrateurs.
      # La distinction est ce qui evite qu'un redemarrage soit declenche pour une base
      # momentanement injoignable : "vivant mais pas pret" n'est pas "a redemarrer".
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs