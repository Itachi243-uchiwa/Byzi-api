<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: pageHead('Connexion')}"></head>
<body>
<div class="login">
    <div class="login__panel">
        <div class="login__brand">
            <span th:replace="~{admin/fragments/layout :: mark}"></span>
            <span class="login__wordmark">Dopamyn</span>
        </div>
        <p class="login__tagline">Back-office - acces reserve</p>

        <!--/* Message unique quelle que soit la cause de l'echec (compte inconnu, mot de
               passe faux, compte non-admin) : detailler renseignerait un attaquant sur les
               comptes qui existent. */-->
        <div class="alert alert--error" th:if="${param.error}">
            Identifiants invalides.
        </div>
        <div class="alert alert--success" th:if="${param.logout}">
            Vous etes deconnecte.
        </div>

        <form class="login__form" th:action="@{/admin/login}" method="post">
            <div class="field">
                <label class="field__label" for="username">Adresse e-mail</label>
                <input class="input" type="email" id="username" name="username"
                       autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label class="field__label" for="password">Mot de passe</label>
                <input class="input" type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Se connecter</button>
        </form>
    </div>
</div>
</body>
</html>
