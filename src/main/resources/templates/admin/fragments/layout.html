<!DOCTYPE html>
<!--/*
  Fragments de structure du back-office.

  Tout ecran admin est assemble a partir d'ici : aucune page ne redefinit son <head>, sa
  navigation ni sa barre de titre. Ajouter une rubrique = une ligne dans le fragment nav,
  et toutes les pages en heritent.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--/* Le mark Dopamyn, en SVG inline (source : design/brand/dopamyn-mark.svg cote iOS).
       Il etait auparavant recadre dans un PNG a coups de pourcentages calcules a la main
       pour isoler le mark d'un fichier qui portait aussi le wordmark et la tagline. Un
       trace vectoriel supprime tout ca : net a n'importe quelle taille, il prend la couleur
       du texte via currentColor, et il ne traine pas d'aplat quasi-noir a masquer sur le
       graphite de la barre laterale. */-->
<span th:fragment="mark" class="brand__logo" aria-hidden="true">
    <svg viewBox="0 0 1024 1024" fill="currentColor" role="presentation">
        <path d="M 600.2 81.9 C 619.6 75.6 644.5 81.5 659.9 87.3 C 675.3 93.2 683.9 106.3 692.4 117.2 C 701.0 128.1 705.6 135.7 711.4 152.5 C 717.3 169.2 725.0 170.1 727.7 217.6 C 730.4 265.1 723.6 383.6 727.7 437.4 C 731.8 491.2 739.9 509.3 752.1 540.5 C 764.4 571.7 775.7 594.3 801.0 624.6 C 826.3 654.9 881.9 697.4 904.1 722.3 C 926.2 747.2 928.1 757.6 933.9 773.9 C 939.8 790.1 941.6 803.2 939.4 820.0 C 937.1 836.7 929.0 858.9 920.4 874.2 C 911.8 889.6 902.3 901.4 887.8 912.2 C 873.3 923.1 847.6 934.8 833.5 939.4 C 819.5 943.9 815.5 942.1 803.7 939.4 C 791.9 936.6 789.7 943.0 763.0 923.1 C 736.3 903.2 678.9 845.8 643.6 820.0 C 608.3 794.2 583.5 781.1 551.3 768.4 C 519.2 755.8 505.7 748.5 450.9 744.0 C 396.2 739.5 270.5 743.1 223.0 741.3 C 175.5 739.5 185.5 739.0 166.0 733.1 C 146.6 727.3 120.4 717.3 106.3 706.0 C 92.3 694.7 85.1 679.8 81.9 665.3 C 78.8 650.8 81.5 635.0 87.3 619.2 C 93.2 603.4 101.8 587.5 117.2 570.3 C 132.6 553.1 148.8 538.7 179.6 516.1 C 210.4 493.5 266.9 461.8 301.7 434.7 C 336.5 407.5 348.3 404.8 388.5 353.3 C 428.8 301.7 507.9 170.6 543.2 125.3 C 578.5 80.1 580.7 88.2 600.2 81.9 Z"/>
    </svg>
</span>

<head th:fragment="pageHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--/* Le back-office manipule des donnees personnelles : il ne doit jamais etre indexe. */-->
    <meta name="robots" content="noindex, nofollow">
    <title th:text="|${pageTitle} - Dopamyn Admin|">Dopamyn Admin</title>
    <link rel="stylesheet" th:href="@{/admin/css/dopamyn-admin.css}">
</head>

<nav th:fragment="mainNav(active)" class="nav">
    <a th:href="@{/admin}" class="nav__item"
       th:classappend="${active == 'dashboard'} ? ' nav__item--active'">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/>
            <rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
        </svg>
        <span>Tableau de bord</span>
    </a>
    <a th:href="@{/admin/users}" class="nav__item"
       th:classappend="${active == 'users'} ? ' nav__item--active'">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        </svg>
        <span>Utilisateurs</span>
    </a>
    <a th:href="@{/admin/audit}" class="nav__item"
       th:classappend="${active == 'audit'} ? ' nav__item--active'">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>Journal d'audit</span>
    </a>
    <a th:href="@{/admin/account}" class="nav__item"
       th:classappend="${active == 'account'} ? ' nav__item--active'">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Mon compte</span>
    </a>
</nav>

<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">
        <span th:replace="~{admin/fragments/layout :: mark}"></span>
        <div>
            <div class="brand__name">Dopamyn</div>
            <div class="brand__sub">Back-office</div>
        </div>
    </div>

    <nav th:replace="~{admin/fragments/layout :: mainNav(${active})}"></nav>

    <div class="sidebar__footer">
        <div class="sidebar__user" sec:authentication="name">admin@dopamyn.app</div>
        <!--/* Deconnexion en POST : un GET serait declenchable par une simple image
               distante et permettrait de deconnecter un admin a son insu. */-->
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="sidebar__logout">Se deconnecter</button>
        </form>
    </div>
</aside>

<header th:fragment="topbar(eyebrow, title, subtitle)" class="topbar">
    <div>
        <div class="topbar__eyebrow" th:text="${eyebrow}">SECTION</div>
        <h1 class="topbar__title" th:text="${title}">Titre</h1>
        <p class="topbar__subtitle" th:if="${subtitle}" th:text="${subtitle}">Sous-titre</p>
    </div>
    <div th:if="${#bools.isTrue(false)}"></div>
</header>

<!--/* Badge de statut d'abonnement. Centralise ici pour que la correspondance
       statut -> couleur fonctionnelle soit definie a UN seul endroit. */-->
<span th:fragment="statusBadge(status)" class="badge"
      th:classappend="${status?.name() == 'ACTIVE'} ? ' badge--active' :
                      (${status?.name() == 'TRIAL'} ? ' badge--trial' :
                      (${status?.name() == 'GRACE_PERIOD'} ? ' badge--grace' : ' badge--expired'))"
      th:text="${status?.name() == 'ACTIVE'} ? 'Actif' :
               (${status?.name() == 'TRIAL'} ? 'Essai' :
               (${status?.name() == 'GRACE_PERIOD'} ? 'Impaye' : 'Expire'))">Statut</span>

<div th:fragment="empty(title, hint)" class="empty">
    <div class="empty__title" th:text="${title}">Rien a afficher</div>
    <div class="empty__hint" th:text="${hint}"></div>
</div>

<!--/* Pagination reutilisable : conserve les parametres de recherche courants pour ne pas
       reinitialiser le filtre en changeant de page. */-->
<div th:fragment="pagination(page, baseUrl, query)" class="pagination" th:if="${page.totalPages > 1}">
    <div class="pagination__info"
         th:text="|Page ${page.number + 1} sur ${page.totalPages} - ${page.totalElements} resultat(s)|">
    </div>
    <div class="pagination__links">
        <a class="pagination__link"
           th:classappend="${page.first} ? ' pagination__link--disabled'"
           th:href="@{{url}(url=${baseUrl}, page=${page.number - 1}, q=${query})}">Precedent</a>
        <a class="pagination__link"
           th:classappend="${page.last} ? ' pagination__link--disabled'"
           th:href="@{{url}(url=${baseUrl}, page=${page.number + 1}, q=${query})}">Suivant</a>
    </div>
</div>

</html>
