# =============================================================================
# Byzi - pile applicative complete (API + PostgreSQL)
#
#   cp .env.example .env    # OBLIGATOIRE, y compris en local
#   docker compose up --build
#
#   -> back-office   : http://localhost:8080/admin
#   -> API + Swagger : http://localhost:8080/swagger-ui.html
#
# ATTENTION : depuis le passage au VPS (2026-09-09), ce fichier n'est plus un
# compose de developpement — c'est LE runtime de production. Les valeurs par
# defaut de developpement qu'il portait sont donc devenues des failles :
#
#   • SPRING_PROFILES_ACTIVE valait "demo" par defaut. Un .env incomplet sur le
#     serveur faisait donc demarrer la PRODUCTION en mode demonstration :
#     DemoDataSeeder amorcait des comptes fictifs et un administrateur
#     admin@byzi.app / byzi-demo, dont le mot de passe est ecrit en clair dans
#     les journaux de demarrage.
#   • JWT_SECRET retombait sur la valeur de developpement ecrite dans ce depot.
#     Les jetons de production auraient ete signes avec une cle publique.
#   • POSTGRES_PASSWORD retombait sur "byzi", avec le port 5432 publie.
#
# Ces trois variables n'ont donc PLUS de valeur par defaut : la syntaxe ${VAR:?}
# fait echouer `docker compose up` avec un message clair si elles manquent. Un
# demarrage qui echoue bruyamment vaut infiniment mieux qu'un demarrage qui
# reussit en mode demo sur des donnees reelles.
# =============================================================================

services:

  db:
    image: postgres:17-alpine
    container_name: byzi-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-byzi}
      POSTGRES_USER: ${POSTGRES_USER:-byzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant — copier .env.example en .env}
    ports:
      # Lie a 127.0.0.1 et non a 0.0.0.0 : un client SQL local (DBeaver, psql,
      # IntelliJ) s'y branche toujours, mais le port n'est plus joignable depuis
      # l'exterieur du VPS. Sans cette adresse, Docker ouvre le port sur toutes
      # les interfaces ET perce le pare-feu UFW, qu'il contourne par ses propres
      # regles iptables — une base de production exposee sans qu'aucune regle de
      # pare-feu ne le laisse deviner.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - byzi-db-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready et non un simple "port ouvert" : Postgres accepte les connexions
      # TCP avant d'etre pret a servir des requetes, et l'API demarrerait alors trop
      # tot en echouant sur la migration Flyway.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-byzi} -d ${POSTGRES_DB:-byzi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: byzi-api
    depends_on:
      db:
        # service_healthy et non le simple "started" : sans cela, Flyway tenterait sa
        # migration sur une base qui n'accepte pas encore de requetes.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE manquant — "prod" sur le serveur, "demo" en local}

      # "db" est le nom du service : c'est le DNS interne du reseau compose, pas
      # localhost - qui, depuis le conteneur api, designerait l'api elle-meme.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-byzi}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:-byzi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}

      # Aucune valeur par defaut : ce fichier tourne en production.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant — openssl rand -base64 48}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      REFERRAL_TRIAL_EXTENSION_DAYS: ${REFERRAL_TRIAL_EXTENSION_DAYS:-7}

      # --- App Store Server Notifications V2 -------------------------------
      # APPLE_ENVIRONMENT filtre REELLEMENT : le verificateur d'Apple rejette une
      # notification dont l'environnement ne correspond pas. Rester sur SANDBOX
      # en production fait donc refuser silencieusement tous les evenements de
      # facturation reels — renouvellements et remboursements compris.
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-Dopamyn-APP.dopamyn-app}
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-SANDBOX}
      # Obligatoire des que APPLE_ENVIRONMENT vaut PRODUCTION.
      APPLE_APP_ID: ${APPLE_APP_ID:-}

      # --- Premier administrateur du back-office ---------------------------
      # Vides par defaut : sans eux, aucun compte admin n'est cree, et c'est
      # voulu — il n'existe deliberement aucun identifiant par defaut. A remplir
      # pour UN demarrage, puis a vider (cf. AdminBootstrap).
      BYZI_ADMIN_BOOTSTRAP_EMAIL: ${BYZI_ADMIN_BOOTSTRAP_EMAIL:-}
      BYZI_ADMIN_BOOTSTRAP_PASSWORD: ${BYZI_ADMIN_BOOTSTRAP_PASSWORD:-}
    ports:
      # Lie a 127.0.0.1, comme la base. Caddy joint l'API par le reseau interne de
      # compose (http://api:8080), jamais par le port de l'hote : publier 8080 sur
      # toutes les interfaces rendait donc l'API joignable en HTTP EN CLAIR sur
      # http://<ip-du-vps>:8080, court-circuitant le TLS de Caddy — et Docker perce
      # UFW par ses propres regles iptables, donc le pare-feu ne le montrait pas.
      # Sur 127.0.0.1, `curl localhost:8080` marche toujours pour deboguer depuis
      # le serveur, et rien n'est expose au dehors.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: byzi-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  byzi-db-data:
  caddy-data:
  caddy-config:
