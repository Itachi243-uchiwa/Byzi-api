name: Deploiement OVH VPS (production)

# Deploiement de l'API Byzi sur le VPS OVHcloud, via SSH + Docker Compose.
#
# Difference fondamentale avec l'ancien workflow Render : la source de verite des
# secrets n'est PLUS GitHub. Sur Render, ce workflow poussait les variables d'environnement
# a chaque deploiement (l'API Render les recevait via PUT). Sur le VPS, les secrets vivent
# UNE FOIS dans le fichier ~/Byzi-api/.env, sur le serveur lui-meme (cf. guide de deploiement
# §10) - ce workflow ne les touche jamais et n'a donc besoin d'aucun des anciens secrets
# applicatifs (DB_URL, JWT_SECRET, REVENUECAT_WEBHOOK_SECRET, etc.). Modifier un secret
# applicatif se fait desormais a la main sur le serveur (nano ~/Byzi-api/.env), pas ici.
#
# Ce que ce workflow fait, dans l'ordre : verifie que les tests passent, se connecte en
# SSH au VPS, recupere le dernier commit de main, reconstruit et relance les conteneurs
# Docker, puis sonde l'API en HTTPS pour confirmer qu'elle repond vraiment (un conteneur
# "Up" ne veut pas dire qu'il sert des reponses correctes - une migration Flyway ratee ou
# un secret manquant dans le .env produit un conteneur vivant qui repond en erreur).
#
# --- Prerequis, a faire une seule fois, a la main -----------------------------------
#   1. Le VPS est configure et accessible en SSH (cf. guide de deploiement, §1 a §9).
#   2. Le fichier ~/Byzi-api/.env existe deja sur le serveur avec les vrais secrets de
#      production (POSTGRES_PASSWORD, JWT_SECRET, REVENUECAT_WEBHOOK_SECRET, etc.).
#   3. Une cle SSH dediee au CI/CD a ete generee sur le VPS et ajoutee a son propre
#      ~/.ssh/authorized_keys (jamais la cle personnelle du developpeur) :
#        ssh-keygen -t ed25519 -f ~/.ssh/github_actions_deploy -C "github-actions-byzi" -N ""
#        cat ~/.ssh/github_actions_deploy.pub >> ~/.ssh/authorized_keys
#   4. Le repo Git est deja clone sur le serveur dans ~/Byzi-api avec une deploy key
#      GitHub en lecture seule (cf. guide, §9) - ce workflow ne fait qu'un "git pull",
#      jamais un clone initial.
#
# --- Secrets GitHub obligatoires (Settings -> Secrets and variables -> Actions) ----
#   VPS_HOST      : l'adresse IPv4 du VPS (Manager OVHcloud -> VPS -> onglet General).
#   VPS_SSH_KEY   : la cle PRIVEE generee au point 3 ci-dessus (cat ~/.ssh/github_actions_deploy),
#                   bloc complet -----BEGIN...-----END OPENSSH PRIVATE KEY-----.
#   VPS_USER      : nom d'utilisateur SSH sur le VPS. Chez OVH pour une image Ubuntu,
#                   c'est "ubuntu" (pas "root", jamais utilise directement).
#
# --- Variables de depot, non secretes (Settings -> Variables) ----------------------
#   API_BASE_URL  : l'URL publique complete de l'API, ex. https://api.byzi.app - sert
#                   uniquement au smoke-test final. A definir des que le domaine et le
#                   Caddyfile (§11 du guide) sont en place ; sans cette variable, le
#                   smoke-test est saute plutot que d'echouer sur une valeur vide.
#
# --- Ce que ce workflow ne fait PAS -------------------------------------------------
#   Aucune synchronisation de variables d'environnement (contrairement a l'ancien
#   workflow Render) : le .env du serveur est la seule source de verite, modifie a la
#   main. Aucune migration explicite non plus : Flyway s'execute au demarrage de
#   l'application (spring.flyway.enabled=true), un schema non migre fait donc echouer
#   le conteneur au demarrage plutot que de deployer silencieusement un etat casse.
# -------------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deux deploiements simultanes se marcheraient dessus (rebuild concurrent sur le meme
# VPS) : cancel-in-progress reste a false, on ne coupe jamais un deploiement deja en
# cours de bascule, on attend juste que le precedent se termine avant de lancer le suivant.
concurrency:
  group: deploy-ovh-vps
  cancel-in-progress: false

jobs:
  # Garde-fou : sans ce job, un push sur main deploierait sans qu'aucun test ne tourne.
  # Le job "deploy" en depend, donc un test rouge arrete la chaine avant de toucher le VPS.
  tests:
    name: Tests (bloque le deploiement si rouge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Meme commande que ci.yml, pour que le filet soit identique.
      - name: Build, tests et couverture
        run: ./mvnw -B verify

  deploy:
    name: Deploiement sur le VPS (git pull + docker compose)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Se connecter en SSH, mettre a jour et relancer les conteneurs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Timeout genereux : "docker compose up --build" reconstruit l'image (compilation
          # Maven incluse) sur un VPS a 2 vCPU, plus lent qu'un runner GitHub dedie.
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/Byzi-api
            git pull --ff-only
            docker compose up --build -d
            # Nettoie les anciennes images non utilisees : sans cela, chaque deploiement
            # laisse une image orpheline et le disque de 40 Go du VPS-1 finit par se remplir.
            docker image prune -f

  smoke:
    name: Verification de l'API deployee
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      # Un "docker compose up" reussi signifie que les conteneurs ont demarre, pas que
      # l'application sert des reponses correctes derriere Caddy. Cette etape est ce qui
      # distingue "deploye" de "utilisable depuis le telephone".
      - name: Sonder l'API en HTTPS
        env:
          BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL:-}" ]; then
            echo "Variable de depot API_BASE_URL non definie - smoke-test saute."
            echo "A definir des que le domaine et Caddy sont en place (Settings -> Variables)."
            exit 0
          fi

          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --max-time 30 "${BASE_URL}/actuator/health" || echo 000)"
            echo "[$i] GET /actuator/health -> $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" != "200" ]; then cat /tmp/health.json || true; exit 1; fi

          docs_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "${BASE_URL}/v3/api-docs")"
          echo "GET /v3/api-docs -> $docs_code"
          [ "$docs_code" = "200" ] || exit 1

          {
            echo "## API Byzi deployee (VPS OVH)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Base URL (a coller dans l'app iOS) | \`${BASE_URL}\` |"
            echo "| Sante | ${BASE_URL}/actuator/health |"
            echo "| Swagger | ${BASE_URL}/swagger-ui.html |"
            echo "| OpenAPI (client Swift) | ${BASE_URL}/v3/api-docs |"
            echo "| Back-office | ${BASE_URL}/admin |"
            echo "| Webhook RevenueCat | ${BASE_URL}/api/v1/webhooks/revenuecat |"
          } >> "$GITHUB_STEP_SUMMARY"